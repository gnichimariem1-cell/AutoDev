services:
  autodev:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # Dans le conteneur, "localhost" designe le conteneur lui-meme : on joint
      # l'Ollama de la machine hote via host.docker.internal.
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434/api/generate}
      # Connexion Claude propre au conteneur (compte Claude), gardee dans un volume.
      CLAUDE_CONFIG_DIR: /claude-config
      DISABLE_AUTOUPDATER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Code + sorties (output/, logs/, checkpoints/) partages avec l'hote.
      - .:/app
      # Connexion Claude du conteneur : conservee entre les redemarrages.
      - claude-config:/claude-config
    restart: unless-stopped

volumes:
  claude-config: